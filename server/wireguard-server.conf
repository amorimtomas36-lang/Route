# Configuração do Servidor WireGuard para RouteBoost
# Local padrão no servidor: /etc/wireguard/wg0.conf

[Interface]
Address = 10.150.0.1/24
ListenPort = 51820
PrivateKey = SERVER_PRIVATE_KEY_HERE
MTU = 1420

# Regras de Firewall e Roteamento para Jogos (IPTABLES)
PostUp = iptables -A FORWARD -i wg0 -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
PostDown = iptables -D FORWARD -i wg0 -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE

# Cliente 1 (Telemóvel Android)
[Peer]
PublicKey = CLIENT_PUBLIC_KEY_HERE
AllowedIPs = 10.150.0.2/32
