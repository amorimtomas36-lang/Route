name: Build RouteBoost APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Conceder permissão de execução ao gradlew
        run: chmod +x gradlew || true

      - name: Compilar APK Debug
        run: ./gradlew :app:assembleDebug --stacktrace || gradle :app:assembleDebug

      - name: Disponibilizar APK para Download no Telemóvel
        uses: actions/upload-artifact@v4
        with:
          name: RouteBoost-APK
          path: app/build/outputs/apk/debug/app-debug.apk
